name: Dependency verification diagnostics

on:
  push:
    branches: [fix/compose-plugin-verification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reproduce dependency verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-verification-diagnostics
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Build APKs with strict verification and verbose errors
        run: >-
          ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease
          --dependency-verification=strict
          -Dorg.gradle.dependency.verification.console=verbose
          --stacktrace
      - name: Print verification report text
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Text(HTMLParser):
              def handle_data(self, data):
                  text = data.strip()
                  if text:
                      print(text)
          for report in sorted(Path('build/reports/dependency-verification').rglob('*.html')):
              print('REPORT:', report)
              Text().feed(report.read_text(encoding='utf-8', errors='replace'))
          PY
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-verification-diagnostics-${{ github.run_id }}
          path: build/reports/dependency-verification/
          if-no-files-found: ignore
          retention-days: 7
