name: Release

# Builds, signs and publishes an APK when a tag like v3.1 is pushed.
# One-time setup: Settings -> Environments -> "release" with secrets
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# (use the same keystore as earlier releases, otherwise updates fail).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not configured for the 'release' environment."
            exit 1
          fi

      - name: Check tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $NAME"
            exit 1
          fi

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Rename, hash and read certificate
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          APK="WarpTuner-$VER.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          CERT=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          {
            echo "## WarpTuner $VER"
            echo
            echo "SHA-256 файла \`$APK\`:"
            echo '```'; echo "$SHA"; echo '```'
            echo
            echo "SHA-256 отпечаток сертификата подписи (одинаков во всех версиях):"
            echo '```'; echo "$CERT"; echo '```'
            echo
            echo "Как проверить файл: [docs/VERIFY.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/VERIFY.md)"
          } > notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.apk }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.meta.outputs.apk }}" "${{ steps.meta.outputs.apk }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WarpTuner ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --generate-notes --verify-tag

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
